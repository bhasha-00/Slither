<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slither</title>
<style>
:root {
  --bg: #07080d;
  --fg: #eef0ff;
  --line: #222638;
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
main {
  width: 100%;
  max-width: 600px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.stage {
  position: relative;
  width: fit-content;
  margin: 0 auto;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #05060d;
}
canvas {
  display: block;
  touch-action: none;
}
#vg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(255,40,60,.8));
  opacity: 0;
}
#ov {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: rgba(5,6,13,.74);
  color: #fff;
}
#ov h2 {
  margin: 0 0 6px;
  font-size: 28px;
  letter-spacing: .14em;
}
#ov p {
  margin: 4px 0;
  font-size: 13px;
  color: #b9bfd6;
  max-width: 36ch;
}
.go {
  margin-top: 14px;
  font-size: 12px;
  letter-spacing: .1em;
  animation: bk 1.2s infinite;
}
@keyframes bk {
  50% { opacity: .25; }
}
#act {
  display: block;
  margin: 12px auto 0;
  padding: 14px 28px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #10121b;
  color: var(--fg);
  font: 700 13px system-ui;
  letter-spacing: .1em;
  touch-action: none;
  cursor: pointer;
}
</style>
</head>
<body>
<main>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div id="vg"></div>
  <div id="ov"></div>
</div>
<button id="act">Hold to boost</button>
</main>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
const L=1000;
let W=1;

function fit(){
  const s=Math.floor(Math.min(innerWidth-24,560,innerHeight*.8));
  const d=Math.min(devicePixelRatio||1,2);
  cv.style.width=cv.style.height=s+'px';
  cv.width=cv.height=s*d;
  W=s*d;
}
addEventListener('resize',fit);
fit();

const M={n:'SLITHER',h0:22,h1:50,bg:'14,8,4',tr:.5,tag:'No grid. Pure flow.',how:'Steer toward your pointer in a round arena. Hold SPACE / the button to boost — it burns your length, which is the only way to relieve pressure.',ctl:'Mouse / touch · ←→ · hold SPACE boosts'};
let st='idle',score=0,energy=0,hold=false,kl=0,kr=0,sl=null,tgt={x:900,y:500},fs=[],P=[],R=[],T=[],shake=0,last=0,time=0,best=0;

try{best=parseInt(localStorage.getItem('slither_best')||'0',10)}catch(e){}
const save=()=>{try{localStorage.setItem('slither_best',best)}catch(e){}};
const col=(i,n,a=1,l=60)=>`hsla(${M.h0+(M.h1-M.h0)*(n>1?i/(n-1):0)},100%,${l}%,${a})`;

let AC,mute=false;
function snd(f,d=.12,ty='sine',v=.08){
  if(mute)return;
  try{
    AC=AC||new AudioContext();
    const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;
    o.type=ty;o.frequency.value=f;
    a.gain.setValueAtTime(v,t);
    a.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(a);a.connect(AC.destination);
    o.start();o.stop(t+d);
  }catch(e){}
}
const PN=[0,2,4,7,9],note=i=>262*Math.pow(2,(PN[i%5]+12*Math.floor(i/5))/12);

function burst(x,y,c,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,v=80+Math.random()*340;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.6,c});
  }
}
const ring=(x,y)=>R.push({x,y,r:10,l:1}),pop=(t,x,y,c)=>T.push({t,x,y,c,l:1});

function orb(){
  const a=Math.random()*6.28,r=Math.sqrt(Math.random())*400;
  fs.push({x:500+Math.cos(a)*r,y:500+Math.sin(a)*r,p:Math.random()*6});
}

function init(){
  score=0;P=[];R=[];T=[];shake=0;hold=false;
  sl={x:500,y:500,a:0,len:12,tr:[],body:[]};
  for(let i=0;i<120;i++)sl.tr.push({x:500-i*3,y:500});
  fs=[];
  for(let i=0;i<7;i++)orb();
  tgt={x:900,y:500};
  stepSl(0);
}

function ov(){
  const o=$('#ov');
  o.style.display='flex';
  o.innerHTML=st==='idle'?
    `<h2 style="color:${col(0,1,1,65)}">${M.n}</h2><p><b>${M.tag}</b></p><p>${M.how}</p><p>${M.ctl}</p><div class="go">PRESS ANY KEY OR TAP</div>`:
    `<h2>GAME OVER</h2><p>Score ${score} · Best ${best}</p><div class="go">PRESS ANY KEY OR TAP TO RETRY</div>`;
}

function start(){
  init();
  st='play';
  $('#ov').style.display='none';
}

function die(){
  shake=16;
  snd(90,.5,'sawtooth',.12);
  sl.body.forEach((p,i)=>{if(i%2==0)burst(p.x,p.y,col(i,10),3)});
  st='over';
  best=Math.max(best,score);
  save();
  ov();
}

function stepSl(dt){
  const s=sl;
  if(kl||kr)s.a+=(kr-kl)*3.4*dt;
  else{
    let d=Math.atan2(tgt.y-s.y,tgt.x-s.x)-s.a;
    d=Math.atan2(Math.sin(d),Math.cos(d));
    const mt=Math.max(1.6,4.2-s.len*.03)*dt;
    s.a+=Math.max(-mt,Math.min(mt,d));
  }
  const bo=hold&&s.len>8&&dt>0,sp=(150+Math.min(s.len*2,90))*(bo?1.7:1);
  if(bo){
    s.len-=dt*2.5;
    if(Math.random()<.6)burst(s.x,s.y,col(3,4),1);
  }
  s.x+=Math.cos(s.a)*sp*dt;
  s.y+=Math.sin(s.a)*sp*dt;
  const lt=s.tr[0];
  if(Math.hypot(s.x-lt.x,s.y-lt.y)>3)s.tr.unshift({x:s.x,y:s.y});
  const gap=15,n=Math.floor(s.len),b=[{x:s.x,y:s.y}];
  let need=gap,ac=0;
  for(let i=1;i<s.tr.length&&b.length<n;i++){
    ac+=Math.hypot(s.tr[i-1].x-s.tr[i].x,s.tr[i-1].y-s.tr[i].y);
    if(ac>=need){b.push(s.tr[i]);need+=gap}
  }
  s.body=b;
  s.tr.length=Math.min(s.tr.length,Math.ceil(n*gap/3)+30);
  if(dt===0)return;
  if(Math.hypot(s.x-500,s.y-500)>462)return die();
  if(b.slice(6).some(p=>Math.hypot(p.x-s.x,p.y-s.y)<13))return die();
  for(let i=fs.length-1;i>=0;i--){
    const o=fs[i];
    if(Math.hypot(o.x-s.x,o.y-s.y)<24){
      fs.splice(i,1);
      orb();
      s.len+=1.3;
      score+=10;
      snd(note(Math.floor(s.len)),.14,'triangle',.09);
      burst(o.x,o.y,col(1,1),14);
      ring(o.x,o.y);
      shake=3;
    }
  }
}

function glow(x,y,r,c){
  g.shadowBlur=22;g.shadowColor=c;g.fillStyle=c;
  g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0;
}

function eyes(x,y,a,r){
  for(const k of[-1,1]){
    const ex=x+Math.cos(a)*r*.35-Math.sin(a)*r*.5*k;
    const ey=y+Math.sin(a)*r*.35+Math.cos(a)*r*.5*k;
    g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,r*.28,0,7);g.fill();
    g.fillStyle='#111';g.beginPath();g.arc(ex+Math.cos(a)*r*.1,ey+Math.sin(a)*r*.1,r*.14,0,7);g.fill();
  }
}

function drawSl(){
  const s=sl,dd=Math.hypot(s.x-500,s.y-500),nr=Math.max(0,Math.min(1,(dd-380)/80));
  g.fillStyle='rgba(255,255,255,.035)';g.beginPath();g.arc(500,500,470,0,7);g.fill();
  g.beginPath();g.arc(500,500,470,0,7);
  g.strokeStyle=`rgba(255,${200-nr*150|0},${120-nr*90|0},${.5+nr*.5})`;
  g.lineWidth=6+nr*8;g.shadowBlur=24;g.shadowColor='#f64';g.stroke();g.shadowBlur=0;
  fs.forEach(o=>glow(o.x,o.y,9+3*Math.sin(time*5+o.p),col(1,1,1,68)));
  const b=s.body,n=b.length;
  for(let i=n-1;i>=0;i--){
    g.fillStyle=col(i,n);g.beginPath();g.arc(b[i].x,b[i].y,15-7*i/n,0,7);g.fill();
  }
  eyes(s.x,s.y,s.a,15);
}

function draw(dt){
  const d=W/L;g.setTransform(d,0,0,d,0,0);
  let sx=0,sy=0;
  if(shake>.3){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=.88}
  g.save();g.translate(sx,sy);
  g.fillStyle=`rgba(${M.bg},${M.tr})`;
  g.fillRect(-20,-20,L+40,L+40);
  drawSl();
  g.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt;
    if(p.l<=0){P.splice(i,1);continue}
    g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,1+4*p.l,0,7);g.fill();
  }
  for(let i=R.length-1;i>=0;i--){
    const r=R[i];r.r+=520*dt;r.l-=dt*1.6;
    if(r.l<=0){R.splice(i,1);continue}
    g.strokeStyle=col(1,1,r.l*.6);g.lineWidth=3;g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke();
  }
  g.globalCompositeOperation='source-over';
  if(st==='over'){
    g.fillStyle='rgba(255,40,60,.12)';
    g.fillRect(0,0,L,L);
  }
  g.restore();
}

function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);
  last=ts;time+=dt;
  if(st==='play'){
    stepSl(dt);
  }
  draw(dt);
  requestAnimationFrame(loop);
}

const KM={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key,m=KM[k];
  if(k===' '||m)e.preventDefault();
  if(k==='m'){mute=!mute;return}
  if(st==='idle'||st==='over'){
    if(k.length===1||k.startsWith('Arrow')||k==='Enter'){start()}
    return;
  }
  if(k===' ')hold=true;
  if(m){if(m[0]<0)kl=1;if(m[0]>0)kr=1;}
});
addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key,m=KM[k];
  if(k===' ')hold=false;
  if(m){if(m[0]<0)kl=0;if(m[0]>0)kr=0;}
});

let px=0,py=0;const stg=$('#stage');
function aim(e){
  const r=cv.getBoundingClientRect();
  tgt={x:(e.clientX-r.left)/r.width*L,y:(e.clientY-r.top)/r.height*L};
}
stg.addEventListener('pointerdown',e=>{
  if(st==='idle'||st==='over')start();
  px=e.clientX;py=e.clientY;
  aim(e);
});
stg.addEventListener('pointermove',aim);

const ab=$('#act');
ab.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(st==='idle'||st==='over'){start();return}
  hold=true;
});
['pointerup','pointerleave','pointercancel'].forEach(v=>ab.addEventListener(v,()=>hold=false));

init();
ov();
requestAnimationFrame(loop);
</script>
</body>
</html>
