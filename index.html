let ev={n:'',t:0},bt=0,mode='slither',M=MODES.slither,st='idle',S=[],prev=[],dir={x:1,y:0},q=[],food={x:0,y:0},score=0,spd=8,acc=0,ins=0,foods=0,energy=0,phase=0,hist=[],grace=0,hold=false,kl=0,kr=0,sl=null,tgt={x:900,y:500},fs=[],P=[],R=[],T=[],shake=0,last=0,time=0,best={};

const PN=[0,2,4,7,9],note=i=>262*Math.pow(2,(PN[i%5]+12*Math.floor(i/5))/12);

function setMode(m){mode=m;M=MODES[m];st='idle';init();ov();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));

const inb=c=>c.x>=ins&&c.y>=ins&&c.x<N-ins&&c.y<N-ins;
function eat(h){const n=S.length;score+=10;snd(note(n),.16,'triangle',.1);burst(cx(h),cy(h),col(1,1),22);ring(cx(h),cy(h));shake=5;pop('+10',cx(h),cy(h),'#fff');

function rw(){const s=hist.pop();S=s.S.map(c=>({...c}));prev=S.map(c=>({...c}));dir=s.dir;q=[];food=s.food;score=s.score;energy-=.9;if(Math.random()<.5)snd(200+Math.random()*80,.05,'sawtooth',.03);burst(cx(S[0]),cy(S[0]),'#9ef',1)}
function stepSl(dt){const s=sl;
 if(kl||kr)s.a+=(kr-kl)*3.4*dt;else{let d=Math.atan2(tgt.y-s.y,tgt.x-s.x)-s.a;d=Math.atan2(Math.sin(d),Math.cos(d));const mt=Math.max(1.6,4.2-s.len*.03)*dt;s.a+=Math.max(-mt,Math.min(mt,d))}

 if(phase>0){g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(p[0].x,p[0].y,C*(.7+.1*Math.sin(time*20)),0,7);g.stroke()}}

function draw(dt){

 g.save();g.translate(sx,sy);g.fillStyle=`rgba(${M.bg},${M.tr})`;g.fillRect(-20,-20,L+40,L+40);
 if(mode==='disco'||ev.n==='DISCO'){M.b=M.b||[M.h0,M.h1];M.h0=time*70%360;M.h1=M.h0+150}
 mode==='slither'?drawSl():drawGrid();
 g.globalCompositeOperation='lighter';
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt;if(p.l<=0){P.splice(i,1);continue}g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,1+4*p.l,0,7);g.fill()}
 for(let i=R.length-1;i>=0;i--){const r=R[i];r.r+=520*dt;r.l-=dt*1.6;if(r.l<=0){R.splice(i,1);continue}g.strokeStyle=col(1,1,r.l*.6);g.lineWidth=3;g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke()}
 g.globalCompositeOperation='source-over';
 g.textAlign='center';g.font='700 26px system-ui';for(let i=T.length-1;i>=0;i--){const t=T[i];t.y-=40*dt;t.l-=dt*1.1;if(t.l<=0){T.splice(i,1);continue}g.globalAlpha=t.l;g.fillStyle=t.c;g.fillText(t.t,t.x,t.y)}g.globalAlpha=1;
 if(ev.t>0){g.fillStyle='#fff';g.font='700 22px system-ui';g.fillText(ev.n+' · '+ev.t,500,44)}
 if(st==='dead'||st==='over'){g.fillStyle='rgba(255,40,60,.12)';g.fillRect(0,0,L,L)}
 const rwd=mode==='rewind'&&hold&&energy>0&&(st==='play'||st==='dead');
 if(rwd){g.fillStyle='rgba(255,255,255,.07)';for(let y=0;y<L;y+=12)g.fillRect(0,y,L,2)}
 cv.style.filter=rwd?'hue-rotate(150deg) saturate(1.8) contrast(1.1)':'';
 g.restore()}
function ui(){const len=mode==='slither'?Math.floor(sl.len):S.length,pr=Math.max(0,Math.min(1,mode==='slither'?sl.len/80:len/((N-2*ins)**2)*3.2));
 $('#sc').textContent=score;$('#ln').textContent=len;$('#bs').textContent=Math.max(best[mode]||0,score);$('#pb').style.width=pr*100+'%';$('#vg').style.opacity=pr*.85;$('#eb').style.width=Math.max(0,energy)+'%'}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;
 if(st==='play'){
  if(mode==='slither')stepSl(dt);
  else if(mode==='rewind'&&hold&&hist.length&&energy>0){acc=0;let k=Math.max(1,Math.round(dt/.03));while(k--&&hist.length&&energy>0)rw()}
  else{acc+=dt;const iv=1/(spd*sf());while(acc>=iv&&st==='play'){acc-=iv;tick()}}
 }else if(st==='dead'){if(hold&&hist.length&&energy>0){rw();st='play';$('#bn').style.display='none'}else{grace-=dt;if(grace<=0){$('#bn').style.display='none';st='over';best[mode]=Math.max(best[mode]||0,score);save();ov()}}}
 draw(dt);ui();requestAnimationFrame(loop)}
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key,m=KM[k];if(k===' '||m)e.preventDefault();
 if(/^[1-9]$/.test(k)){setMode(Object.keys(MODES)[k-1]);return}if(k==='m'){mute=!mute;return}
 if(st==='idle'||st==='over'){if(k.length===1||k.startsWith('Arrow')||k==='Enter'){start();if(m)turn(m[0],m[1])}return}
 if(k===' '){hold=true;act()}
 if(m){if(mode==='slither'){if(m[0]<0)kl=1;if(m[0]>0)kr=1}else turn(m[0],m[1])}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key,m=KM[k];if(k===' ')hold=false;if(m&&mode==='slither'){if(m[0]<0)kl=0;if(m[0]>0)kr=0}});
let px=0,py=0;const stg=$('#stage');
function aim(e){const r=cv.getBoundingClientRect();tgt={x:(e.clientX-r.left)/r.width*L,y:(e.clientY-r.top)/r.height*L}}
stg.addEventListener('pointerdown',e=>{if(st==='idle'||st==='over')start();px=e.clientX;py=e.clientY;if(mode==='slither')aim(e)});
stg.addEventListener('pointermove',e=>{if(mode==='slither')aim(e)});
stg.addEventListener('pointerup',e=>{if(mode==='slither')return;const dx=e.clientX-px,dy=e.clientY-py;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
const ab=$('#act');ab.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='idle'||st==='over'){start();return}hold=true;act()});
['pointerup','pointerleave','pointercancel'].forEach(v=>ab.addEventListener(v,()=>hold=false));
setMode('slither');requestAnimationFrame(loop);
